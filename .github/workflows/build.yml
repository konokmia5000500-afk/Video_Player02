name: Build Fast Player APK
on:
  workflow_dispatch:
  push:
    branches: [Version002]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$( (ls FastPlayer*.zip 2>/dev/null || ls *.zip 2>/dev/null) | head -n 1)
          echo "Using zip: $ZIP"
          unzip -q "$ZIP" -d proj
          PROJ=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build release APK
        shell: bash
        run: |
          cd "$PROJ"
          gradle assembleRelease --no-daemon --console=plain > "$GITHUB_WORKSPACE/build.log" 2>&1 || { grep -nE 'What went wrong|FAILED|Caused by|Missing class|^e: ' -A4 "$GITHUB_WORKSPACE/build.log" | head -100; exit 1; }
      - name: Publish the single APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APKS=$(ls "$PROJ"/app/build/outputs/apk/release/*.apk)
          echo "$APKS"
          cp "$(echo "$APKS" | head -n 1)" FastPlayer-arm64.apk
          ls -lh FastPlayer-arm64.apk
          gh release create "v002-${{ github.run_number }}" FastPlayer-arm64.apk \
            --target "${{ github.sha }}" \
            --title "Fast Player v002 build ${{ github.run_number }}" \
            --notes "Single arm64 APK for Symphony Innova 10"
