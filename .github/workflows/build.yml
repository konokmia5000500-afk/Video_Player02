name: Build ARM64 APK from ZIP

on:
  push:
    branches:
      - Version004
  workflow_dispatch:

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract ZIP and configure arm64-v8a
        id: extract
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip file found in this branch."
            exit 1
          fi
          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "$ZIP_FILE" -d extracted_project

          SETTINGS_FILE=$(find extracted_project -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle.kts not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          cd "$PROJECT_DIR"

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          python3 -c '
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          text = p.read_text()
          target = "defaultConfig {"
          injection = "defaultConfig {\n    ndk {\n      abiFilters += listOf(\"arm64-v8a\")\n    }"
          if "abiFilters" not in text and target in text:
              p.write_text(text.replace(target, injection, 1))
          '

      - name: Build arm64-v8a APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug --no-daemon -Pandroid.injected.build.abi=arm64-v8a

      - name: Collect APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          mkdir -p "${{ github.workspace }}/apk_output"
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file was not generated."
            exit 1
          fi
          cp "$APK_PATH" "${{ github.workspace }}/apk_output/Fast-Player-arm64-v8a.apk"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Player-arm64-v8a-apk
          path: apk_output/Fast-Player-arm64-v8a.apk
