name: Build APK from Version004 ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - Version004

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Version004 branch
        uses: actions/checkout@v4
        with:
          ref: Version004

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract ZIP from Version004
        run: |
          mkdir -p build_src
          ZIP_FILE=$(find . -maxdepth 3 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No .zip file found in branch Version004!"
            ls -la
            exit 1
          fi
          echo "Using ZIP file: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE" -d build_src
          ls -la build_src

      - name: Build Debug APK
        run: |
          PROJECT_ROOT=$(dirname "$(find build_src -name "settings.gradle.kts" | head -n 1)")
          if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "." ]; then
            echo "Error: settings.gradle.kts not found after extracting ZIP!"
            exit 1
          fi
          echo "Building project at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          if [ ! -f "debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-player-version004-debug-apk
          path: build_src/**/app/build/outputs/apk/debug/*.apk
