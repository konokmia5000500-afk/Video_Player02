name: Build Fast Player APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ Version004]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract fast-player.zip
        run: |
          mkdir -p build_src
          unzip -o -q fast-player.zip -d build_src
          ls -la build_src

      - name: Build Debug APK
        run: |
          cd build_src
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fast-player-debug-apk
          path: build_src/app/build/outputs/apk/debug/app-debug.apk
